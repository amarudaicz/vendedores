<div class="container mx-auto w-full px-3 md:px-0">
  <div class="flex flex-col md:flex-row gap-x-10 py-6">

    <div class="w-full md:w-2/5 md:min-w-[220px] md:max-w-[220px]">
      <app-customer-details></app-customer-details>
    </div>

    <div class="w-full">
      <div class="flex gap-x-4 items-center mb-3 p-2 bg-white rounded-lg shadow-sm">
        <a
          routerLink="/client/balance"
          routerLinkActive="bg-primary text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-primary font-semibold px-4 py-2 rounded-md"
        >
        Cuenta Corriente
        </a>

        <a
          routerLink="/client/balance/orders"
          routerLinkActive="bg-primary text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-primary font-semibold px-4 py-2 rounded-md"
        >
          Órdenes
        </a>
      </div>

      <router-outlet> </router-outlet>
    </div>
  </div>
</div>
