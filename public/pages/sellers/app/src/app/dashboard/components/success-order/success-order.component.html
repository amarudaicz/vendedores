<div class="flex flex-col items-center justify-center h-full p-4 text-center">
    <div class="bg-green-100 rounded-full p-6 mb-4">
        <!-- Icono de check (puedes usar una librería de iconos o un SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
    </div>
    
    <h2 class="text-2xl font-bold text-gray-800 mb-2">¡Orden creada con éxito!</h2>
    <p class="text-gray-600 mb-6">El número de orden es:</p>
    
    <div class="text-4xl font-extrabold text-blue-600 mb-8">
        #{{ orderId }}
    </div>
    
    <button (click)="newOrder()" class="bg-black hover:bg-neutral-800 text-white font-bold py-3 px-6 rounded-lg transition duration-300">
        Crear nueva orden
    </button>
</div>
