<aside class="lg:sticky top-5 z-10">
  <div class="flex flex-col gap-y-3 rounded-xl h-full bg-white">
    <div
      *ngIf="seller; else loading"
      class="flex flex-col justify-center items-center p-3"
    >
      <div
        class="flex justify-center items-center w-12 uppercase text-xl h-12 rounded-full bg-primary text-white"
      >
        {{ seller.name[0] }}
      </div>
      <h5 class="text-lg font-medium">{{ seller.name }}</h5>
      <span class="text-sm text-gray-700">Vendedor ID: {{ seller.code }}</span>
    </div>

    <ng-template #loading>
      <div class="flex justify-center items-center h-full p-4">
        <svg
          class="animate-spin h-5 w-5 text-gray-700"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
      </div>
    </ng-template>

    <nav class="" *ngIf="seller">
      <ul
        class="flex p-3 gap-y-2 flex-col h-full max-w-[300px] lg:max-w-[400px]"
      >
        @for (item of navItems; track $index) {
        <li class="">
          <a
            class="font-bold py-2 px-3 w-full rounded-md flex items-center gap-x-2"
            routerLinkActive="bg-primary text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            [routerLink]="item.link"
          >
            <i [ngClass]="item.icon"></i>
            {{ item.label }}
          </a>
        </li>
        }
      </ul>
    </nav>
  </div>
</aside>
