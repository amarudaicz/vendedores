<main class="w-full h-full -mt-3">
  <section class="h-screen bg-slate-200">
    <div class="w-full h-full flex justify-center items-center">
      <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-gray-900 text-center mb-2">
          Iniciar sesión
        </h2>

        @if (error) {
        <span
          class="text-sm p-2 block rounded-md mb-2 border-l-4 bg-red-100 border-red-600"
        >
          {{ error }}
        </span>
        }@else {
        <div class="h-[36px] mb-2"></div>
        }

        <form [formGroup]="form" (ngSubmit)="login()" class="space-y-4">
          <!-- Email -->
          <div>
            <div class="flex"> 
              <label for="email" class="block text-sm font-medium text-gray-700"
                >Usuario</label
              >
            </div>
            <input
              formControlName="email"
              type="text"
              id="email"
              name="email"
              class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm"
              placeholder="Ingresa tu email"
              required
            />
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700"
              >Password</label
            >
            <div class="relative">
              <input
                formControlName="password"
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                name="password"
                class="mt-1 block w-full px-4 py-2 border border-blue-300 rounded-md shadow-sm"
                placeholder="Ingresa tu contraseña"
                required
              />
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5"
              >
                <svg
                  *ngIf="!showPassword"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5 text-gray-500"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
                <svg
                  *ngIf="showPassword"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5 text-gray-500"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <div>
            <button
              type="submit"
              [disabled]="loading"
              [ngClass]="
                loading ? 'bg-gray-400' : 'bg-black hover:bg-neutral-900'
              "
              class="w-full px-4 py-2 text-white rounded-md"
            >
              Login
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>
