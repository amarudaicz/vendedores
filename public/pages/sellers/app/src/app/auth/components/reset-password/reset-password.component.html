<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-center">Actualizar Contraseña</h2>
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="currentPassword" class="block text-sm font-medium text-gray-700">Contraseña Actual</label>
          <input
            type="password"
            id="currentPassword"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700">Nueva Contraseña</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            (input)="validatePassword()"
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
          />
          <!-- Lista de validación -->
          <div class="mt-2 text-sm text-gray-500">
            <ul class="space-y-2">
              <li class="flex items-center" [ngClass]="{'text-green-700': isLengthValid, 'text-gray-600': !isLengthValid}">
                <i class="icon-[icon-park-outline--check-one]" *ngIf="isLengthValid"></i>
                <i class="icon-[icon-park-outline--close-one]" *ngIf="!isLengthValid"></i>
                <span class="ml-2">Al menos 8 caracteres</span>
              </li>
              <li class="flex items-center" [ngClass]="{'text-green-700': hasSpecialChar, 'text-gray-600': !hasSpecialChar}">
                <i class="icon-[icon-park-outline--check-one]" *ngIf="hasSpecialChar"></i>
                <i class="icon-[icon-park-outline--close-one]" *ngIf="!hasSpecialChar"></i>
                <span class="ml-2">Al menos un carácter especial (e.g., !&#64;#$%^&*)</span>
              </li>
              <li class="flex items-center" [ngClass]="{'text-green-700': hasNumber, 'text-gray-600': !hasNumber}">
                <i class="icon-[icon-park-outline--check-one]" *ngIf="hasNumber"></i>
                <i class="icon-[icon-park-outline--close-one]" *ngIf="!hasNumber"></i>
                <span class="ml-2">Al menos un número</span>
              </li>
              <li class="flex items-center" [ngClass]="{'text-green-700': hasUpperCase, 'text-gray-600': !hasUpperCase}">
                <i class="icon-[icon-park-outline--check-one]" *ngIf="hasUpperCase"></i>
                <i class="icon-[icon-park-outline--close-one]" *ngIf="!hasUpperCase"></i>
                <span class="ml-2">Al menos una letra mayúscula</span>
              </li>
            </ul>
          </div>
          
        </div>
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirma Contraseña</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>
        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          >
            Actualizar Contraseña
          </button>
        </div>
      </form>
    </div>
  </div>
